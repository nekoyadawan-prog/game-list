<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイゲーム置き場</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #3498db;
        }
        .card p {
            font-size: 0.9rem;
            color: #666;
        }
        .card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .card a:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>🎮 マイゲームコレクション</h1>
    <p style="text-align: center;">これまでに作ったブラウザゲームたちです。ぜひ遊んでいってください！</p>

    <div class="grid">
        <div class="card">
            <h2>1. ダーツ</h2>
            <p>狙いを定めてスコアを競う定番ゲーム！</p>
            <a href="https://nekoyadawan-prog.github.io/darts/" target="_blank">遊ぶ</a>
        </div>
        <div class="card">
            <h2>2. 番重整理</h2>
            <p>頭を使うパズル・整理ゲーム！</p>
            <a href="https://nekoyadawan-prog.github.io/banju/" target="_blank">遊ぶ</a>
        </div>
        <div class="card">
            <h2>3. フェイスアップ</h2>
            <p>楽しく遊べるモグラ系のゲーム！</p>
            <a href="https://nekoyadawan-prog.github.io/mogura/" target="_blank">遊ぶ</a>
        </div>
        <div class="card">
            <h2>4. 二郎系スワイプ盛り付け</h2>
            <p>豪快にトッピングを盛り付けるユニークなアクション！</p>
            <a href="https://nekoyadawan-prog.github.io/jirosuwaipu/" target="_blank">遊ぶ</a>
        </div>
        <div class="card">
            <h2>5. ローソンshooting</h2>
            <p>爽快感あふれるシューティングゲーム！</p>
            <a href="https://nekoyadawan-prog.github.io/shooting/" target="_blank">遊ぶ</a>
        </div>
    </div>

</body>
</html>
